# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/capability_map_v2.json
version: 2
kind: CapabilityMap
name: Anbernic RG 55G1 Mapping
id: anbernic_rg55g1

mapping:
  - name: Guide Button
    source_events:
      - evdev:
          event_type: KEY
          event_code: KEY_F10
          value_type: button
    target_event:
      gamepad:
        button: Guide

  - name: F1 Key
    source_events:
      - evdev:
          event_type: KEY
          event_code: KEY_BACK
          value_type: button
    target_event:
      keyboard: KeyF1

# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
version: 1
kind: CompositeDevice
name: Anbernic RG 55G1

matches:
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: Anbernic RG 55G1

single_source: false

source_devices:
  - group: gamepad
    evdev:
      name: Anbernic RG 55G1 Gamepad
      handler: event*
    capability_map_id: anbernic_rg55g1
  - group: gamepad
    evdev:
      name: gpio-keys
      phys_path: gpio-keys/input0
      handler: event*
  - group: gamepad
    evdev:
      name: pm8xxx_vib_ffmemless
      handler: event*

options:
  auto_manage: true

target_devices:
  - ds5
  - keyboard
